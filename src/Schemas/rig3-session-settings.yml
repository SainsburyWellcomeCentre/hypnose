%YAML 1.1
---
# yaml-language-server: $schema=data-schema.json

metadata:
  animalId: plimbo
  rootPath: test
  minimumSampleTime: 0.05
  loggingRootPath: C:\temp
  rewardTime: 0.01625
  initialSequence: Schemas/odourdiscrimination-stage4.yml
  eegRecordingEnabled: True
  maximumRewardsAvailable: 150

shortcutKeys:
  endSessionKey: Ctrl+3
  startOlfactometerPurgeKey: Shift+3
  startCamera: Alt+3
  pulse1Key: Ctrl+7
  pulse2Key: Ctrl+8
  # Use Shift+5 to set 5s pulse time, Shift+6 to set 1s pulse time (default)

hardwarePorts:
  behaviorBoard: COM3
  olfactometer0: COM11
  olfactometer1: COM13

eegProperties:
  deviceName: 25089

cameraProperties:
  cameraId: 24282626
  frameRate: 60
  binning: 2
  exposure: 12000
  gain: 0
  threshold: 5
  binaryThreshold: 100
  roiSourcePoints:
    points:
      - x: 80
        y: 330
      - x: 80
        y: 380
      - x: 520
        y: 380
      - x: 520
        y: 330

olfactometerCommands:
  - {name: Default, valvesOpenO0: [], valvesOpenO1: [], endValvesOpenO0: [], endValvesOpenO1: [], targetFlowO0: [0, 0, 0, 0, 400], targetFlowO1: [0, 0, 0, 100, 400]}
  - {name: Zero, valvesOpenO0: [], valvesOpenO1: [], endValvesOpenO0: [], endValvesOpenO1: [], targetFlowO0: [0, 0, 0, 0, 1], targetFlowO1: [0, 0, 0, 0, 1]}
  - {name: Purge, valvesOpenO0: [], valvesOpenO1: [3], endValvesOpenO0: [], endValvesOpenO1: [0], targetFlowO0: [0, 0, 0, 0, 400], targetFlowO1: [0, 0, 0, 100, 400]}
  - {name: OdorA, valvesOpenO0: [0], valvesOpenO1: [], endValvesOpenO0: [], endValvesOpenO1: [], targetFlowO0: [100, 0, 0, 0, 781], targetFlowO1: [0, 0, 0, 0, 400]}
  - {name: OdorB, valvesOpenO0: [], valvesOpenO1: [0], endValvesOpenO0: [0], endValvesOpenO1: [], targetFlowO0: [0, 0, 0, 0, 400], targetFlowO1: [100, 0, 0, 0, 336]}
  - {name: OdorC, valvesOpenO0: [2], valvesOpenO1: [], endValvesOpenO0: [], endValvesOpenO1: [], targetFlowO0: [0, 0, 100, 0, 798], targetFlowO1: [0, 0, 0, 0, 400]}
  - {name: OdorD, valvesOpenO0: [3], valvesOpenO1: [], endValvesOpenO0: [], endValvesOpenO1: [], targetFlowO0: [0, 0, 0, 100, 900], targetFlowO1: [0, 0, 0, 0, 400]}
  - {name: OdorE, valvesOpenO0: [1], valvesOpenO1: [], endValvesOpenO0: [], endValvesOpenO1: [], targetFlowO0: [0, 100, 0, 0, 893], targetFlowO1: [0, 0, 0, 0, 400]}
  - {name: OdorF, valvesOpenO0: [], valvesOpenO1: [1], endValvesOpenO0: [0], endValvesOpenO1: [], targetFlowO0: [0, 0, 0, 0, 400], targetFlowO1: [0, 100, 0, 0, 337]}
  - {name: OdorG, valvesOpenO0: [], valvesOpenO1: [2], endValvesOpenO0: [0], endValvesOpenO1: [], targetFlowO0: [0, 0, 0, 0, 400], targetFlowO1: [0, 0, 100, 0, 366]}
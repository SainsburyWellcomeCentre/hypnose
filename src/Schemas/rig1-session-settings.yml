%YAML 1.1
---
# yaml-language-server: $schema=data-schema.json

metadata:
  animalId: plimbo
  rootPath: test
  minimumSampleTime: 0.05
  loggingRootPath: C:\temp
  rewardTime: 0.014875
  initialSequence: Schemas/quintuples-option6.yml
  eegRecordingEnabled: False
  maximumRewardsAvailable: 100

shortcutKeys:
  endSessionKey: Ctrl+1
  startOlfactometerPurgeKey: Shift+1
  startCamera: Alt+1
  pulse1Key: Ctrl+9
  pulse2Key: Ctrl+4
  # Use Shift+5 to set 5s pulse time, Shift+6 to set 1s pulse time (default)

hardwarePorts:
  behaviorBoard: COM14
  olfactometer0: COM5
  olfactometer1: COM7

eegProperties:
  deviceName: 16514

cameraProperties:
  cameraId: 24282618
  frameRate: 60
  binning: 2
  exposure: 12000
  gain: 0
  threshold: 5
  binaryThreshold: 120
  roiSourcePoints:
    points:
      - x: 120
        y: 310
      - x: 120
        y: 360
      - x: 540
        y: 360
      - x: 540
        y: 310

olfactometerCommands:
  - {name: Default, valvesOpenO0: [], valvesOpenO1: [], endValvesOpenO0: [], endValvesOpenO1: [], targetFlowO0: [0, 0, 0, 0, 400], targetFlowO1: [0, 0, 0, 100, 400]}
  - {name: Zero, valvesOpenO0: [], valvesOpenO1: [], endValvesOpenO0: [], endValvesOpenO1: [], targetFlowO0: [0, 0, 0, 0, 1], targetFlowO1: [0, 0, 0, 0, 1]}
  - {name: Purge, valvesOpenO0: [], valvesOpenO1: [3], endValvesOpenO0: [], endValvesOpenO1: [0], targetFlowO0: [0, 0, 0, 0, 400], targetFlowO1: [0, 0, 0, 100, 400]}
  - {name: OdorA, valvesOpenO0: [0], valvesOpenO1: [], endValvesOpenO0: [], endValvesOpenO1: [], targetFlowO0: [100, 0, 0, 0, 810], targetFlowO1: [0, 0, 0, 0, 400]}
  - {name: OdorB, valvesOpenO0: [], valvesOpenO1: [0], endValvesOpenO0: [0], endValvesOpenO1: [], targetFlowO0: [0, 0, 0, 0, 400], targetFlowO1: [100, 0, 0, 0, 345]}
  - {name: OdorC, valvesOpenO0: [2], valvesOpenO1: [], endValvesOpenO0: [], endValvesOpenO1: [], targetFlowO0: [0, 0, 100, 0, 825], targetFlowO1: [0, 0, 0, 0, 400]}
  - {name: OdorD, valvesOpenO0: [3], valvesOpenO1: [], endValvesOpenO0: [], endValvesOpenO1: [], targetFlowO0: [0, 0, 0, 100, 820], targetFlowO1: [0, 0, 0, 0, 400]}
  - {name: OdorE, valvesOpenO0: [1], valvesOpenO1: [], endValvesOpenO0: [], endValvesOpenO1: [], targetFlowO0: [0, 100, 0, 0, 850], targetFlowO1: [0, 0, 0, 0, 400]}
  - {name: OdorF, valvesOpenO0: [], valvesOpenO1: [1], endValvesOpenO0: [0], endValvesOpenO1: [], targetFlowO0: [0, 0, 0, 0, 400], targetFlowO1: [0, 100, 0, 0, 358]}
  - {name: OdorG, valvesOpenO0: [], valvesOpenO1: [2], endValvesOpenO0: [0], endValvesOpenO1: [], targetFlowO0: [0, 0, 0, 0, 400], targetFlowO1: [0, 0, 100, 0, 345]}
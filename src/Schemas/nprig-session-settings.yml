%YAML 1.1
---
# yaml-language-server: $schema=data-schema.json

metadata:
  animalId: plimbo
  rootPath: test
  minimumSampleTime: 0.05
  loggingRootPath: C:\temp
  rewardTime: 0.014875
  initialSequence: Schemas/doubles-option5-stage2.yml
  eegRecordingEnabled: False
  maximumRewardsAvailable: 200

shortcutKeys:
  endSessionKey: Ctrl+4
  startOlfactometerPurgeKey: Shift+4
  startCamera: Alt+4

hardwarePorts:
  behaviorBoard: COM5
  olfactometer0: COM4
  olfactometer1: COM9

cameraProperties:
  cameraId: 24284790
  frameRate: 60
  exposure: 12000
  gain: 10
  threshold: 3
  roiSourcePoints:
    points:
      - x: 180
        y: 650
      - x: 180
        y: 750
      - x: 1050
        y: 750
      - x: 1050
        y: 650

trackingProperties:
  cropSourcePoints:
    points:
      - x: 180
        y: 102
      - x: 180
        y: 947
      - x: 1025
        y: 947
      - x: 1025
        y: 102
  minArea: 900
  immobilityAlert:
    radius: 20
    alertAfterMinutes: 1
    sendTestOnStart: true
    notifyWhenMovingAgain: true
    rigName: Hypnose NP Rig
    webhookUrlFile: slack_webhook.txt

olfactometerCommands:
  - {name: Default, valvesOpenO0: [], valvesOpenO1: [], endValvesOpenO0: [0], targetFlowO0: [0, 0, 0, 0, 400], targetFlowO1: [0, 0, 0, 100, 400]}
  - {name: Zero, valvesOpenO0: [], valvesOpenO1: [], endValvesOpenO0: [], targetFlowO0: [0, 0, 0, 0, 1], targetFlowO1: [0, 0, 0, 0, 1]}
  - {name: Purge, valvesOpenO0: [], valvesOpenO1: [3], endValvesOpenO0: [], targetFlowO0: [0, 0, 0, 0, 400], targetFlowO1: [0, 0, 0, 0, 400]}
  - {name: OdorA, valvesOpenO0: [0], valvesOpenO1: [], endValvesOpenO0: [0], targetFlowO0: [100, 0, 0, 0, 810], targetFlowO1: [0, 0, 0, 0, 400]}
  - {name: OdorB, valvesOpenO0: [], valvesOpenO1: [0], endValvesOpenO0: [0], targetFlowO0: [0, 0, 0, 0, 400], targetFlowO1: [100, 0, 0, 0, 400]}
  - {name: OdorC, valvesOpenO0: [2], valvesOpenO1: [], endValvesOpenO0: [0], targetFlowO0: [0, 0, 100, 0, 825], targetFlowO1: [0, 0, 0, 0, 400]}
  - {name: OdorD, valvesOpenO0: [3], valvesOpenO1: [], endValvesOpenO0: [0], targetFlowO0: [0, 0, 0, 100, 820], targetFlowO1: [0, 0, 0, 0, 400]}
  - {name: OdorE, valvesOpenO0: [1], valvesOpenO1: [], endValvesOpenO0: [0], targetFlowO0: [0, 100, 0, 0, 850], targetFlowO1: [0, 0, 0, 0, 400]}
  - {name: OdorF, valvesOpenO0: [], valvesOpenO1: [1], endValvesOpenO0: [0], targetFlowO0: [0, 0, 0, 0, 400], targetFlowO1: [0, 100, 0, 0, 400]}
  - {name: OdorG, valvesOpenO0: [], valvesOpenO1: [2], endValvesOpenO0: [0], targetFlowO0: [0, 0, 0, 0, 400], targetFlowO1: [0, 0, 100, 0, 400]}
  - {name: OdorH, valvesOpenO0: [], valvesOpenO1: [3], endValvesOpenO0: [0], targetFlowO0: [0, 0, 0, 0, 400], targetFlowO1: [0, 0, 0, 100, 400]}